# artipascher.fr hors ligne — ne plus proxifier vers l’app (Nord Artisan Pro reste sur :3001).
# Certificats Let’s Encrypt conservés pour éviter qu’un autre vhost ne prenne le Host.

server {
    listen 80;
    listen [::]:80;
    server_name artipascher.fr www.artipascher.fr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    error_page 410 /artipascher-gone.html;
    location = /artipascher-gone.html {
        root /var/www/html;
        internal;
    }

    location / {
        return 410;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name artipascher.fr www.artipascher.fr;

    ssl_certificate /etc/letsencrypt/live/artipascher.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/artipascher.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    error_page 410 /artipascher-gone.html;
    location = /artipascher-gone.html {
        root /var/www/html;
        internal;
    }

    location / {
        return 410;
    }
}
