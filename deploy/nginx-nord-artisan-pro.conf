# Prod Nord Artisan Pro — proxy :3001 (même app que artipascher.fr)
# www → apex en HTTPS ; apex proxy Next

server {
    listen 80;
    listen [::]:80;
    server_name nord-artisan-pro.com www.nord-artisan-pro.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://nord-artisan-pro.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.nord-artisan-pro.com;

    ssl_certificate /etc/letsencrypt/live/nord-artisan-pro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nord-artisan-pro.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://nord-artisan-pro.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nord-artisan-pro.com;

    ssl_certificate /etc/letsencrypt/live/nord-artisan-pro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nord-artisan-pro.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
